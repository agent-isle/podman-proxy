[package]
name = "podman-proxy"
version = "0.1.0"
edition = "2021"
description = "A Unix socket proxy that enforces a sandbox mount policy on Podman container create requests"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
httparse = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
too_many_lines = { level = "deny", priority = 1 }
excessive_nesting = { level = "deny", priority = 1 }
